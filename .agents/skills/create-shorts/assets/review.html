<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쇼츠 후보 검토</title>
<style>
:root{color-scheme:dark;--bg:#10141c;--card:#1a2230;--line:#354355;--text:#eef2f8;--muted:#aab8cb;--accent:#f0ce83}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,"Malgun Gothic",sans-serif}.wrap{max-width:1350px;margin:auto;padding:30px 24px 110px}h1{font-size:32px;margin:8px 0}h2{font-size:19px;margin:8px 0}p{margin:8px 0}.muted{color:var(--muted)}button,input,select,textarea{font:inherit}button,select,input,textarea{color:var(--text);background:#202c3c;border:1px solid var(--line);border-radius:8px;padding:8px 12px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0}.toolbar input[type=search]{flex:1;min-width:170px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.card.selected{border-color:#83dabb}.media{position:relative;background:#070a10}video{display:block;width:100%;max-height:300px;object-fit:contain}.caption{position:absolute;bottom:52px;left:7%;right:7%;text-align:center;pointer-events:none;font-weight:700;font-size:18px;white-space:pre-line;text-shadow:0 1px 3px black,1px 0 black,-1px 0 black}.body{padding:18px}.badge{font-weight:bold;color:var(--accent)}textarea{width:100%;resize:vertical;min-height:64px;margin:10px 0}.issue{border-left:3px solid var(--accent);padding:10px;margin:12px 0;background:#252a30;font-size:13px}.issue input[type=text]{width:100%;margin:8px 0}.error{color:#ffacac}a{color:var(--accent)}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center;background:#111925f5;border-top:1px solid var(--line);padding:12px}.primary{background:var(--accent);color:#252014;font-weight:bold}.notice{border-left:3px solid var(--accent);padding:12px 16px;background:#222938;margin:18px 0}.empty{padding:24px;color:var(--muted)}@media(max-width:600px){.wrap{padding:20px 14px 150px}h1{font-size:27px}.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<div class="badge">SHORTS / REVIEW</div><h1>쇼츠 후보 검토</h1><p id="source" class="muted"></p>
<div class="notice">카드 안에서 바로 재생해 번호별로 선택하고 메모를 남겨주세요. 선택 결과를 복사하거나 JSON으로 저장해 채팅에 전달하면 됩니다.<br>불확실한 자막은 해당 음원을 듣고 확인한 표현을 입력해주세요. 미확정 항목은 최종 영상 출력 전에 확인받습니다.</div>
<p id="listening" class="muted"></p><div class="toolbar"><input id="search" type="search" aria-label="후보 검색" placeholder="번호·제목·내용 검색"><select id="category" aria-label="소재 유형"><option value="">전체 유형</option></select><label><input id="only" type="checkbox"> 선택한 후보만</label></div>
<p id="count" class="muted"></p><section id="grid" class="grid" aria-label="쇼츠 후보 목록"></section>
<p class="muted">선택과 메모는 이 브라우저에 저장됩니다. 다른 브라우저로 옮기기 전 결과를 내보내주세요. 파일은 로컬에서만 재생합니다.</p></main>
<footer class="bottom"><span id="selected-count"></span><button id="copy" class="primary">선택 결과 복사</button><button id="download">선택 JSON 저장</button><span id="status" role="status"></span></footer>
<script>
const DATA=__REVIEW_DATA__;
const $=s=>document.querySelector(s),key='shorts-review:'+DATA.job_id;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=t=>{t=Math.max(0,Math.floor(t));return [Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(v=>String(v).padStart(2,'0')).join(':')};
let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
function record(id){if(!state[id])state[id]={selected:false,note:'',confirmations:{}};if(!state[id].confirmations)state[id].confirmations={};return state[id]}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{$('#status').textContent='브라우저 저장 실패: 결과를 내려받아 보관해주세요.'}counts()}
function counts(){const chosen=DATA.clips.filter(c=>c.active!==false&&record(c.id).selected);let unresolved=0;for(const c of chosen)for(const u of c.uncertain||[]){const r=record(c.id).confirmations[u.id];if(!r?.confirmed||!r.replacement?.trim()||r.revision!==c.revision||r.start!==u.start||r.end!==u.end||r.text!==u.text)unresolved++}$('#selected-count').textContent=`선택 ${chosen.length}개 · 자막 미확정 ${unresolved}개`}
function results(){return {job_id:DATA.job_id,selection_only:true,clips:DATA.clips.filter(c=>c.active!==false&&record(c.id).selected).map(c=>({id:c.id,revision:c.revision,title:c.title,parts:c.parts,selected:true,note:record(c.id).note,confirmations:(c.uncertain||[]).map(u=>{const r=record(c.id).confirmations[u.id]||{};const fresh=r.revision===c.revision&&r.start===u.start&&r.end===u.end&&r.text===u.text;return {...u,confirmed:!!(fresh&&r.confirmed),replacement:fresh?r.replacement||'':''}})}))}}
function render(){const q=$('#search').value.toLocaleLowerCase(),cat=$('#category').value,only=$('#only').checked;const list=DATA.clips.filter(c=>c.active!==false&&(!only||record(c.id).selected)&&(!cat||cat===c.category)&&(!q||[c.id,c.title,c.reason].join(' ').toLocaleLowerCase().includes(q)));$('#count').textContent=`${list.length}개 표시 / 전체 ${DATA.clips.filter(c=>c.active!==false).length}개 · 번호 유지`;
$('#grid').innerHTML=list.map(c=>{const r=record(c.id);return `<article class="card${r.selected?' selected':''}" data-card="${c.id}"><div class="media"><video controls playsinline preload="metadata" aria-label="${c.id} 후보 영상" src="${esc(c.file)}"></video><div class="caption"></div></div><div class="body"><span class="badge">${c.id} · ${esc(c.category)} · ${c.duration.toFixed(1)}초</span><h2>${esc(c.title)}</h2><p class="muted">원본 ${c.parts.map(p=>`${time(p.start)}–${time(p.end)}`).join(' / ')}</p><p>${esc(c.reason)}</p><p class="muted">${c.caption_status==='unverified'?'자막 시간 미검증 · 동기화 자막 숨김':'음원 기준 시간 정렬 · '+esc(c.caption_method||'전사')} ${(c.uncertain||[]).length?'· 확인 필요 '+c.uncertain.length+'개':''}</p><label><input type="checkbox" data-select="${c.id}" ${r.selected?'checked':''}> 이 후보 선택</label><textarea data-note="${c.id}" aria-label="${c.id} 메모" placeholder="수정할 컷이나 장면을 적어주세요">${esc(r.note)}</textarea>${(c.uncertain||[]).map(u=>{const saved=r.confirmations[u.id]||{},fresh=saved.revision===c.revision&&saved.start===u.start&&saved.end===u.end&&saved.text===u.text;return `<div class="issue"><b>자막 확인 필요 · ${time(u.start)}</b><p>현재: ${esc(u.text)}<br>대안: ${esc((u.alternatives||[]).join(' / ')||'직접 입력')}<br>${esc(u.reason)}</p><button data-seek="${u.start}" aria-label="${c.id} ${esc(u.id)} 음원 확인">해당 시점 재생 ▶</button><input type="text" data-replace="${esc(u.id)}" aria-label="${c.id} ${esc(u.id)} 확인한 표현" value="${esc(fresh?saved.replacement||'':'')}" placeholder="들은 표현 또는 [자막 생략]"><label><input type="checkbox" data-confirm="${esc(u.id)}" ${fresh&&saved.confirmed?'checked':''}> 내가 음성을 확인했음</label></div>`}).join('')}<p class="error" role="alert"></p><a href="${esc(c.file)}" download>검토 MP4 저장</a></div></article>`}).join('')||'<p class="empty">조건에 맞는 후보가 없습니다.</p>';
for(const card of document.querySelectorAll('[data-card]')){const c=DATA.clips.find(c=>c.id===card.dataset.card),v=card.querySelector('video');v.addEventListener('play',()=>document.querySelectorAll('video').forEach(other=>{if(other!==v)other.pause()}));v.addEventListener('error',()=>card.querySelector('.error').textContent='영상 파일을 읽지 못했습니다. 해당 번호를 알려주세요.');let frame=0;const paint=()=>{const cue=c.caption_status==='unverified'?null:(c.captions||[]).find(t=>v.currentTime>=t.start&&v.currentTime<t.end);card.querySelector('.caption').textContent=cue?.text||''};const tick=()=>{paint();if(!v.paused&&!v.ended)frame=requestAnimationFrame(tick)};v.addEventListener('play',()=>{cancelAnimationFrame(frame);tick()});v.addEventListener('pause',()=>{cancelAnimationFrame(frame);paint()});v.addEventListener('seeked',paint);v.addEventListener('timeupdate',paint)}counts()}
$('#source').textContent=DATA.source_label||'원본 영상';$('#listening').textContent=DATA.actual_listening==='not_run'?'자동 음원 분석 결과입니다. 직접 청취 검수는 수행하지 않았습니다.':'청취 기록: '+(DATA.actual_listening||'미기록');for(const cat of new Set(DATA.clips.filter(c=>c.active!==false).map(c=>c.category))){const o=document.createElement('option');o.value=cat;o.textContent=cat;$('#category').append(o)}
$('#search').addEventListener('input',render);$('#category').addEventListener('change',render);$('#only').addEventListener('change',render);
$('#grid').addEventListener('input',e=>{const card=e.target.closest('[data-card]');if(!card)return;const r=record(card.dataset.card),c=DATA.clips.find(c=>c.id===card.dataset.card);if(e.target.hasAttribute('data-note')){r.note=e.target.value;save()}if(e.target.hasAttribute('data-replace')){const id=e.target.dataset.replace,u=c.uncertain.find(u=>u.id===id);r.confirmations[id]={...u,revision:c.revision,replacement:e.target.value,confirmed:false};card.querySelectorAll('[data-confirm]').forEach(el=>{if(el.dataset.confirm===id)el.checked=false});save()}});
$('#grid').addEventListener('change',e=>{const card=e.target.closest('[data-card]');if(!card)return;const r=record(card.dataset.card),c=DATA.clips.find(c=>c.id===card.dataset.card);if(e.target.hasAttribute('data-select')){r.selected=e.target.checked;card.classList.toggle('selected',r.selected);save();if($('#only').checked)render()}if(e.target.hasAttribute('data-confirm')){const id=e.target.dataset.confirm,u=c.uncertain.find(u=>u.id===id),old=r.confirmations[id]||{};if(e.target.checked&&!old.replacement?.trim()){e.target.checked=false;$('#status').textContent='먼저 확인한 표현을 입력해주세요.';return}r.confirmations[id]={...u,revision:c.revision,replacement:old.replacement||'',confirmed:e.target.checked};save()}});
$('#grid').addEventListener('click',e=>{const b=e.target.closest('[data-seek]');if(!b)return;const v=b.closest('[data-card]').querySelector('video');v.currentTime=Math.max(0,Number(b.dataset.seek)-.4);v.play().catch(()=>{$('#status').textContent='영상의 재생 버튼을 눌러주세요.'})});
$('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(JSON.stringify(results(),null,2));$('#status').textContent='선택 결과를 복사했습니다. 채팅에 붙여넣어주세요.'}catch{$('#status').textContent='복사가 지원되지 않습니다. 선택 JSON 저장을 사용해주세요.'}});
$('#download').addEventListener('click',()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(results(),null,2)],{type:'application/json;charset=utf-8'}));a.href=url;a.download=DATA.job_id+'-selection.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('#status').textContent='선택 JSON을 저장했습니다.'});render();
</script></body></html>
