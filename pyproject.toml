[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kim-silver-project-foundation"
version = "0.1.0"
description = "Domain-neutral project foundation for deterministic local verification."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
thumbnail = ["Pillow>=10,<12"]

[tool.project-foundation]
node = ">=20,<22"
required-dependencies = ["python-standard-library"]
optional-capabilities = ["thumbnail:Pillow", "browser:user-session"]
